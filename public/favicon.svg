<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vorta">
  <!--
    La marca de Vorta. Un trazo que baja y vuelve a subir más alto de donde
    arrancó: se lee como la V del nombre y como una línea de valor que cae y se
    recupera, que es de lo que trata la app.

    Reemplaza el rayo de la plantilla de Vite. Geometría a propósito: un solo
    trazo, un solo color, remates redondeados. A 16px sigue siendo legible
    porque no hay detalle que perder.

    Sin fondo: este archivo es el favicon y el glifo suelto. Los PNG de tienda
    se generan de `marca.svg`, que sí trae el fondo y el área segura.
  -->
  <path d="M 150 196 L 256 334 L 362 122"
        fill="none" stroke="#7c6af7" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
